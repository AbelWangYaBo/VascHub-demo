<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VascHub · 全血管数字平台</title>
  <meta name="description" content="覆盖外周、神经、主动脉与结构性心脏病的全血管介入数字中枢：产品矩阵、术式路径、病例随访、术者培训、器械追溯与真实世界数据。">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M16 6v9m0 0-6 5m6-5 6 5m-6 0v6' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 3v7.5M12 10.5 7 14.5m5-4 5 4M12 10.5V20"/>
            <circle cx="12" cy="3" r="1.2" fill="#fff" stroke="none"/>
            <circle cx="6.4" cy="15" r="1.2" fill="#fff" stroke="none"/>
            <circle cx="17.6" cy="15" r="1.2" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <div class="brand-txt">
          <strong>VascHub</strong>
          <span>全血管数字平台</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <b>演示环境 · v0.9</b>
        <span id="side-identity" class="tiny" style="display:block;margin-top:2px;color:#9fb3b9"></span>
        外周 / 神经 / 主动脉 / 结构性心脏病<br>
        数据保存在本地浏览器
        <button id="btn-reset" style="margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.18);color:#9fb3b9;border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer">重置演示数据</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="crumb">VascHub · 全血管与结构性心脏病介入平台</div>
          <div class="title" id="page-title">总览驾驶舱</div>
          <div class="tiny muted" id="page-sub"></div>
        </div>
        <div class="top-actions">
          <div class="identity-box">
            <span class="dot" style="background:#0d9488"></span>
            <select id="identity-select" class="select" aria-label="切换演示身份" title="切换演示身份：不同身份看到不同的培训档案与操作留痕"></select>
          </div>
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input id="global-search" type="search" placeholder="搜索病例 / 产品 / 术式" aria-label="全局搜索">
          </div>
          <button class="btn" id="btn-assistant">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5 13.9 9l5.6 1.6-5.6 1.6L12 20l-1.9-7.8L4.5 10.6 10.1 9z"/></svg>
            方案助手
          </button>
          <button class="btn primary" id="btn-new-case">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
            新建病例
          </button>
        </div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
